spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true&requireSSL=true&zeroDateTimeBehavior=convertToNull
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # TODO: 운영 DB 테이블 전부 생성되면 validate로 되돌리기
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  cloud:
    aws:
      region:
        static: ${AWS_REGION}

logging:
  level:
    com.cotato.nextstation: INFO
    org.hibernate.SQL: warn

jwt:
  secret: ${JWT_SECRET}

auth:
  refresh-cookie:
    secure: true
    same-site: None

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}

kakao:
  oauth:
    client-id: ${KAKAO_OAUTH_CLIENT_ID}
    client-secret: ${KAKAO_OAUTH_CLIENT_SECRET}
    redirect-uris: ${KAKAO_OAUTH_REDIRECT_URIS}